name: IconShift Android

on:
  push:
    paths:
      - "iconshift/**"
      - ".github/workflows/iconshift-android.yml"
  pull_request:
    paths:
      - "iconshift/**"
      - ".github/workflows/iconshift-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iconshift
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests + debug APK
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:assembleDebug --stacktrace

      - name: Upload POC APK
        uses: actions/upload-artifact@v4
        with:
          name: iconshift-poc-debug-apk
          path: iconshift/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iconshift-test-reports
          path: iconshift/core/build/reports/tests/
