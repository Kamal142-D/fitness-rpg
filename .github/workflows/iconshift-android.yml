name: IconShift Android

on:
  push:
    paths:
      - "iconshift/**"
      - ".github/workflows/iconshift-android.yml"
  pull_request:
    paths:
      - "iconshift/**"
      - ".github/workflows/iconshift-android.yml"
  workflow_dispatch:

# One build per branch at a time, so two runs never race on the rolling prerelease.
concurrency:
  group: iconshift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: iconshift
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests + debug APK
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:assembleDebug --stacktrace

      - name: Upload POC APK
        uses: actions/upload-artifact@v4
        with:
          name: iconshift-poc-debug-apk
          path: iconshift/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Direct .apk download for phones: a rolling "iconshift-poc" PRE-release.
      # It must stay a prerelease: the Fitness RPG in-app updater reads /releases/latest,
      # which skips prereleases, so this never shows up as a Fitness RPG update.
      - name: Reset rolling POC release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete iconshift-poc --cleanup-tag --yes --repo "${{ github.repository }}" || true

      - name: Stage APK for release
        if: github.event_name == 'push'
        run: cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/iconshift-poc.apk"

      - name: Publish POC APK as prerelease
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: iconshift-poc
          target_commitish: ${{ github.sha }}
          name: IconShift POC (HyperOS test build)
          prerelease: true
          make_latest: false
          files: iconshift-poc.apk
          body: |
            IconShift Phase 1 proof-of-concept test build from ${{ github.ref_name }} @ ${{ github.sha }}.

            Install: open iconshift-poc.apk on the phone and allow "Install unknown apps" when asked.
            Then follow the device test protocol in iconshift/README.md (needs Shizuku).

            This is a test build, not a Fitness RPG release.

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iconshift-test-reports
          path: iconshift/core/build/reports/tests/
